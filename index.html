<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор калорий и БЖУ</title>
    <style>
        :root {
            --bg: #eef2f7;
            --card: #ffffff;
            --ink: #1f2933;
            --muted: #5c6b7a;
            --accent: #2f80ed;
            --line: #d7e0ea;
        }

        * {
            box-sizing: border-box;
        }

        html {
            background: var(--bg);
        }

        body {
            max-width: 520px;
            margin: 24px auto;
            padding: 24px 20px 28px;
            background: var(--card);
            color: var(--ink);
            border-radius: 14px;
            box-shadow: 0 1px 3px rgba(16, 24, 40, .08), 0 10px 24px rgba(16, 24, 40, .06);
            font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        }

        h1 {
            margin: 0 0 20px;
            font-size: 22px;
            line-height: 1.25;
            text-align: center;
        }

        .subtitle {
            margin: -10px 0 20px;
            font-size: 13px;
            line-height: 1.45;
            color: var(--muted);
            text-align: center;
        }

        /* these <br> tags only separated the plain form rows; the fields below
           control their own spacing, the ones inside #result still break lines */
        body > br {
            display: none;
        }

        label {
            display: block;
            margin: 0 0 14px;
            font-size: 14px;
            font-weight: 600;
            color: var(--muted);
        }

        label input[type="number"],
        label select {
            display: block;
            width: 100%;
            margin-top: 6px;
            padding: 10px 12px;
            font: inherit;
            font-size: 16px;
            color: var(--ink);
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 8px;
        }

        label input[type="number"]:focus,
        label select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(47, 128, 237, .18);
        }

        label input[type="number"]::placeholder {
            color: #9aa7b4;
            font-weight: 400;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin: 0 8px 0 0;
            vertical-align: -3px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        #childSection {
            margin-bottom: 14px;
        }

        #childSection label {
            margin-bottom: 0;
        }

        .hint {
            margin: 6px 0 0;
            font-size: 12px;
            font-weight: 400;
            line-height: 1.45;
            color: var(--muted);
        }

        /* the optional extras sit in their own block under the fields */
        .checks {
            margin-top: 4px;
            padding-top: 12px;
            border-top: 1px solid var(--line);
        }

        label input.invalid,
        label select.invalid {
            border-color: #d64545;
            background: #fdf5f5;
        }

        #error {
            margin-top: 14px;
            padding: 10px 12px;
            font-size: 14px;
            line-height: 1.5;
            color: #8a2b2b;
            background: #fdf5f5;
            border: 1px solid #f0cbcb;
            border-radius: 10px;
        }

        #error:empty {
            display: none;
        }

        button {
            display: block;
            width: 100%;
            margin: 6px 0 0;
            padding: 12px 16px;
            font: inherit;
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            background: var(--accent);
            border: 0;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #2a72d4;
        }

        button:active {
            background: #2461b8;
        }

        #result {
            margin-top: 18px;
            padding: 14px 16px;
            font-size: 15px;
            line-height: 1.9;
            color: var(--ink);
            background: #f4f8fd;
            border: 1px solid var(--line);
            border-radius: 10px;
        }

        #result:empty {
            display: none;
        }

        /* one row per value: muted label left, number right */
        .metric {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 12px;
        }

        .metric b {
            font-size: 1.05em;
            white-space: nowrap;
        }

        /* phones: fill the screen instead of floating a card, tighten the
           spacing between fields and give the controls touch-sized heights */
        @media (max-width: 480px) {
            body {
                margin: 0 auto;
                padding: 20px 16px 24px;
                border-radius: 0;
                box-shadow: none;
            }

            h1 {
                margin-bottom: 16px;
                font-size: 20px;
            }

            .subtitle {
                margin-bottom: 16px;
            }

            label {
                margin-bottom: 12px;
            }

            label input[type="number"],
            label select {
                min-height: 44px;
                padding: 9px 12px;
            }

            /* the checkbox lines were 21px slivers 12px apart: give each one a
               comfortable touch row and group the four of them tightly */
            label:has(input[type="checkbox"]) {
                display: flex;
                align-items: center;
                min-height: 40px;
                margin-bottom: 4px;
            }

            button {
                min-height: 46px;
                margin-top: 10px;
            }

            #error {
                font-size: 13px;
            }

            #result {
                margin-top: 16px;
                padding: 14px;
                font-size: 15px;
                line-height: 1.9;
            }
        }
    </style>
    <script>
        function numberValue(id) {
            return parseFloat(document.getElementById(id).value);
        }

        // Проверяет поле и добавляет причину в список проблем
        function checkField(id, title, min, max, problems) {
            var el = document.getElementById(id);
            var raw = el.value.trim();

            if (el.validity && el.validity.badInput) {
                problems.push(title + ": нужно ввести число, например 70.5.");
                el.classList.add("invalid");
                return;
            }

            if (raw === "") {
                problems.push(title + ": заполни поле.");
                el.classList.add("invalid");
                return;
            }

            var value = parseFloat(raw);

            if (!isFinite(value)) {
                problems.push(title + ": нужно ввести число.");
                el.classList.add("invalid");
            } else if (value < min || value > max) {
                problems.push(title + ": допустимо от " + min + " до " + max + ".");
                el.classList.add("invalid");
            }
        }

        function metricRow(title, value) {
            return '<div class="metric"><span>' + title + '</span><b>' + value + '</b></div>';
        }

        function calculateCalories() {
            var isChild = document.getElementById("isChild").checked;
            var problems = [];

            document.querySelectorAll(".invalid").forEach(function (el) {
                el.classList.remove("invalid");
            });

            // Для детей возраст, вес и рост не используются
            if (!isChild) {
                checkField("age", "Возраст", 10, 120, problems);
                checkField("weight", "Вес", 20, 400, problems);
                checkField("height", "Рост", 80, 250, problems);
            }

            var errorBox = document.getElementById("error");
            if (problems.length) {
                errorBox.innerHTML = problems.join("<br>");
                document.getElementById("result").innerHTML = "";
                return;
            }
            errorBox.innerHTML = "";

            var age = numberValue("age");
            var weight = numberValue("weight");
            var height = numberValue("height");
            var gender = document.getElementById("gender").value;
            var activity = parseFloat(document.getElementById("activity").value);
            var goal = document.getElementById("goal").value;
            var formula = document.getElementById("formula").value;
            var childAgeGroup = document.getElementById("childAgeGroup").value;
            var isPregnant = document.getElementById("pregnancy").checked;
            var isBreastfeeding = document.getElementById("breastfeeding").checked;
            var cycle = document.getElementById("cycle").checked;

            var calories;

            // Если выбран расчёт для детей
            if (isChild) {
                switch (childAgeGroup) {
                    case "infant":
                        calories = 800; // Примерная калорийность для младенцев
                        break;
                    case "toddler":
                        calories = 1200; // Для детей 1-3 лет
                        break;
                    case "child4_8":
                        calories = 1600; // Для детей 4-8 лет
                        break;
                    case "child9_13":
                        calories = (gender == "male") ? 1800 : 1600; // Для детей 9-13 лет
                        break;
                    case "teen14_18":
                        calories = (gender == "male") ? 2400 : 2000; // Для подростков 14-18 лет
                        break;
                }
                // Учет физической активности у детей
                calories *= activity;
            } else {
                // Рассчитываем BMR по выбранной формуле для взрослых
                var bmr;
                if (formula == "mifflin") {
                    bmr = (gender == "male") ?
                        (10 * weight + 6.25 * height - 5 * age + 5) :
                        (10 * weight + 6.25 * height - 5 * age - 161);
                } else {
                    bmr = (gender == "male") ?
                        (88.36 + (13.4 * weight) + (4.8 * height) - (5.7 * age)) :
                        (447.6 + (9.2 * weight) + (3.1 * height) - (4.3 * age));
                }

                // Учет физической активности
                calories = bmr * activity;

                // Учет беременности и грудного вскармливания
                if (isPregnant) {
                    calories += 300; // Дополнительные калории для беременности
                }
                if (isBreastfeeding) {
                    calories += 500; // Дополнительные калории для грудного вскармливания
                }

                // Учет менструального цикла
                if (cycle) {
                    calories += 100; // Дополнительные калории во время менструации
                }

                // Коррекция в зависимости от цели
                if (goal == "lose20") {
                    calories *= 0.8; // Снижение на 20%
                } else if (goal == "lose15") {
                    calories *= 0.85; // Снижение на 15%
                } else if (goal == "muscleGain") {
                    calories *= 1.15; // Увеличение на 15% для набора мышечной массы
                }
            }

            // Расчет БЖУ
            var proteins = calories * 0.3 / 4; // 30% белков, 1 г белка = 4 ккал
            var fats = calories * 0.3 / 9; // 30% жиров, 1 г жира = 9 ккал
            var carbs = calories * 0.4 / 4; // 40% углеводов, 1 г углеводов = 4 ккал

            // Вывод результатов
            document.getElementById("result").innerHTML =
                metricRow("Калории:", Math.round(calories) + " ккал") +
                metricRow("Белки:", Math.round(proteins) + " г") +
                metricRow("Жиры:", Math.round(fats) + " г") +
                metricRow("Углеводы:", Math.round(carbs) + " г");
        }

        function toggleChildSection() {
            var showChildren = document.getElementById("isChild").checked;
            document.getElementById("childSection").style.display = showChildren ? "block" : "none";
        }
    </script>
</head>
<body>
    <h1>Калькулятор калорий и БЖУ</h1>
    <p class="subtitle">Дневная норма калорий и БЖУ: белки 30%, жиры 30%, углеводы 40%</p>
    <label>Возраст: <input type="number" id="age" min="10" max="120" placeholder="например, 30"></label><br>
    <label>Вес (кг): <input type="number" id="weight" min="20" max="400" step="0.1" placeholder="например, 70"></label><br>
    <label>Рост (см): <input type="number" id="height" min="80" max="250" placeholder="например, 175"></label><br>
    <label>Пол: 
        <select id="gender">
            <option value="male">Мужчина</option>
            <option value="female">Женщина</option>
        </select>
    </label><br>
    <label>Формула расчёта:
        <select id="formula">
            <option value="mifflin">Миффлина-Сан Жеора</option>
            <option value="harris">Харриса-Бенедикта</option>
        </select>
    </label><br>
    <label>Цель:
        <select id="goal">
            <option value="maintain">Поддержание веса</option>
            <option value="lose20">Похудение 20%</option>
            <option value="lose15">Похудение 15%</option>
            <option value="muscleGain">Набор мышечной массы</option>
        </select>
    </label><br>
    <label>Активность:
        <select id="activity">
            <option value="1.2">Минимальная</option>
            <option value="1.375">Легкая</option>
            <option value="1.55">Средняя</option>
            <option value="1.725">Высокая</option>
        </select>
    </label><br>

    <div class="checks">
        <label>Дети: <input type="checkbox" id="isChild" onchange="toggleChildSection()"></label><br>
        <div id="childSection" style="display: none;">
            <label>Возрастная группа:
                <select id="childAgeGroup">
                    <option value="infant">0-1 год</option>
                    <option value="toddler">1-3 года</option>
                    <option value="child4_8">4-8 лет</option>
                    <option value="child9_13">9-13 лет</option>
                    <option value="teen14_18">14-18 лет</option>
                </select>
            </label>
            <div class="hint">Для детей калории считаются по возрастной группе: возраст, вес и рост не используются.</div>
        </div>
        <label>Беременность: <input type="checkbox" id="pregnancy"> +300 ккал</label><br>
        <label>Грудное вскармливание: <input type="checkbox" id="breastfeeding"> +500 ккал</label><br>
        <label>Менструальный цикл: <input type="checkbox" id="cycle"> +100 ккал</label><br>
        <div class="hint">Эти добавки учитываются только во взрослом расчёте.</div>
    </div>

    <div id="error" role="alert"></div>
    <button onclick="calculateCalories()">Рассчитать</button>

    <div id="result"></div>
</body>
</html>
