<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор калорий и БЖУ</title>
    <script src="calc.js"></script>
    <style>
        :root {
            --accent: #2f8f5b;
            --accent-dark: #24724a;
            --ink: #1f2d27;
            --muted: #6b7a72;
            --line: #dde6e1;
            --bg: #f3f7f4;
            --card: #ffffff;
            --error-bg: #fdecec;
            --error-ink: #b3261e;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px 16px;
            background: var(--bg);
            color: var(--ink);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
            line-height: 1.5;
        }

        .card {
            max-width: 520px;
            margin: 0 auto;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 24px;
            box-shadow: 0 6px 24px rgba(31, 45, 39, 0.06);
        }

        h1 {
            margin: 0 0 6px;
            font-size: 24px;
            line-height: 1.25;
        }

        .subtitle {
            margin: 0 0 20px;
            color: var(--muted);
            font-size: 14px;
        }

        .section {
            border: 0;
            margin: 0 0 18px;
            padding: 0;
        }

        .section-title {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--muted);
            margin: 0 0 10px;
        }

        .field {
            display: grid;
            grid-template-columns: 150px 1fr;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .field > label {
            font-size: 15px;
        }

        input[type="number"],
        select {
            width: 100%;
            padding: 9px 10px;
            font-size: 15px;
            font-family: inherit;
            color: var(--ink);
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 8px;
        }

        input[type="number"]:focus,
        select:focus {
            outline: 2px solid var(--accent);
            outline-offset: 1px;
            border-color: var(--accent);
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--accent);
        }

        button {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            font-weight: 600;
            font-family: inherit;
            color: #fff;
            background: var(--accent);
            border: 0;
            border-radius: 10px;
            cursor: pointer;
        }

        button:hover {
            background: var(--accent-dark);
        }

        .result {
            margin-top: 18px;
            padding: 16px;
            border-radius: 10px;
            background: #eef7f1;
            border: 1px solid #cfe8d9;
            display: none;
        }

        .result .calories {
            font-size: 26px;
            font-weight: 700;
            color: var(--accent-dark);
        }

        .result .macros {
            margin-top: 8px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .result .macro {
            padding: 8px;
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 8px;
            text-align: center;
        }

        .result .macro b {
            display: block;
            font-size: 17px;
        }

        .result .macro span {
            font-size: 13px;
            color: var(--muted);
        }

        .error {
            display: none;
            margin-top: 14px;
            padding: 10px 12px;
            border-radius: 8px;
            background: var(--error-bg);
            color: var(--error-ink);
            font-size: 14px;
        }

        @media (max-width: 480px) {
            .field {
                grid-template-columns: 1fr;
                gap: 4px;
            }
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>Калькулятор калорий и БЖУ</h1>
        <p class="subtitle">Рассчитайте суточную норму калорий и распределение по белкам, жирам и углеводам.</p>

        <fieldset class="section" id="adultSection">
            <div class="section-title">Основные данные</div>
            <div class="field">
                <label for="age">Возраст</label>
                <input type="number" id="age" min="1" max="120">
            </div>
            <div class="field">
                <label for="weight">Вес (кг)</label>
                <input type="number" id="weight" min="1" max="400">
            </div>
            <div class="field">
                <label for="height">Рост (см)</label>
                <input type="number" id="height" min="30" max="250">
            </div>
            <div class="field">
                <label for="gender">Пол</label>
                <select id="gender">
                    <option value="male">Мужчина</option>
                    <option value="female">Женщина</option>
                </select>
            </div>
            <div class="field">
                <label for="formula">Формула расчёта</label>
                <select id="formula">
                    <option value="mifflin">Миффлина-Сан Жеора</option>
                    <option value="harris">Харриса-Бенедикта</option>
                </select>
            </div>
            <div class="field">
                <label for="goal">Цель</label>
                <select id="goal">
                    <option value="maintain">Поддержание веса</option>
                    <option value="lose20">Похудение 20%</option>
                    <option value="lose15">Похудение 15%</option>
                    <option value="muscleGain">Набор мышечной массы</option>
                </select>
            </div>
            <div class="field">
                <label for="activity">Активность</label>
                <select id="activity">
                    <option value="1.2">Минимальная</option>
                    <option value="1.375">Легкая</option>
                    <option value="1.55">Средняя</option>
                    <option value="1.725">Высокая</option>
                </select>
            </div>
        </fieldset>

        <fieldset class="section">
            <div class="section-title">Расчёт для ребёнка</div>
            <div class="field">
                <label for="isChild">Дети</label>
                <input type="checkbox" id="isChild">
            </div>
            <div id="childSection" style="display: none;">
                <div class="field">
                    <label for="childAgeGroup">Возрастная группа</label>
                    <select id="childAgeGroup">
                        <option value="infant">0-1 год</option>
                        <option value="toddler">1-3 года</option>
                        <option value="child4_8">4-8 лет</option>
                        <option value="child9_13">9-13 лет</option>
                        <option value="teen14_18">14-18 лет</option>
                    </select>
                </div>
            </div>
        </fieldset>

        <fieldset class="section" id="extrasSection">
            <div class="section-title">Дополнительно</div>
            <div class="field">
                <label for="pregnancy">Беременность</label>
                <input type="checkbox" id="pregnancy">
            </div>
            <div class="field">
                <label for="breastfeeding">Грудное вскармливание</label>
                <input type="checkbox" id="breastfeeding">
            </div>
            <div class="field">
                <label for="cycle">Менструальный цикл</label>
                <input type="checkbox" id="cycle">
            </div>
        </fieldset>

        <button onclick="calculateCalories()">Рассчитать</button>

        <div id="result" class="result" role="status"></div>
        <div id="error" class="error" role="alert"></div>
    </main>

    <script>
        var els = {
            age: document.getElementById("age"),
            weight: document.getElementById("weight"),
            height: document.getElementById("height"),
            gender: document.getElementById("gender"),
            formula: document.getElementById("formula"),
            goal: document.getElementById("goal"),
            activity: document.getElementById("activity"),
            isChild: document.getElementById("isChild"),
            childSection: document.getElementById("childSection"),
            adultSection: document.getElementById("adultSection"),
            childAgeGroup: document.getElementById("childAgeGroup"),
            pregnancy: document.getElementById("pregnancy"),
            breastfeeding: document.getElementById("breastfeeding"),
            cycle: document.getElementById("cycle"),
            extrasSection: document.getElementById("extrasSection"),
            result: document.getElementById("result"),
            error: document.getElementById("error")
        };

        // Показывает/скрывает блоки, не относящиеся к выбранному режиму
        function syncSections() {
            var isChild = els.isChild.checked;
            var isFemale = els.gender.value === "female";

            els.childSection.style.display = isChild ? "block" : "none";
            els.adultSection.style.display = isChild ? "none" : "block";
            els.extrasSection.style.display = isChild ? "none" : "block";

            // Беременность, грудное вскармливание и цикл применимы только к женщинам
            els.pregnancy.disabled = !isFemale;
            els.breastfeeding.disabled = !isFemale;
            els.cycle.disabled = !isFemale;
            if (!isFemale) {
                els.pregnancy.checked = false;
                els.breastfeeding.checked = false;
                els.cycle.checked = false;
            }
        }

        function showError(message) {
            els.result.style.display = "none";
            els.result.innerHTML = "";
            els.error.style.display = "block";
            els.error.textContent = message;
        }

        function showResult(calories) {
            var proteins = calories * 0.3 / 4; // 30% белков, 1 г белка = 4 ккал
            var fats = calories * 0.3 / 9;     // 30% жиров, 1 г жира = 9 ккал
            var carbs = calories * 0.4 / 4;    // 40% углеводов, 1 г углеводов = 4 ккал

            els.error.style.display = "none";
            els.error.textContent = "";
            els.result.style.display = "block";
            els.result.innerHTML =
                "<div class='calories'>" + Math.round(calories) + " ккал</div>" +
                "<div class='macros'>" +
                "<div class='macro'><b>" + Math.round(proteins) + " г</b><span>Белки</span></div>" +
                "<div class='macro'><b>" + Math.round(fats) + " г</b><span>Жиры</span></div>" +
                "<div class='macro'><b>" + Math.round(carbs) + " г</b><span>Углеводы</span></div>" +
                "</div>";
        }

        function calculateCalories() {
            var activity = parseFloat(els.activity.value);

            if (els.isChild.checked) {
                var calories = calcTotalCalories({
                    isChild: true,
                    childAgeGroup: els.childAgeGroup.value,
                    gender: els.gender.value,
                    activity: activity
                });
                if (calories === null) {
                    showError("Выберите возрастную группу ребёнка.");
                    return;
                }
                showResult(calories);
                return;
            }

            var age = parseFloat(els.age.value);
            var weight = parseFloat(els.weight.value);
            var height = parseFloat(els.height.value);

            if (!age || !weight || !height || age <= 0 || weight <= 0 || height <= 0) {
                showError("Пожалуйста, заполните возраст, вес и рост положительными числами.");
                return;
            }

            showResult(calcTotalCalories({
                weight: weight,
                height: height,
                age: age,
                gender: els.gender.value,
                formula: els.formula.value,
                activity: activity,
                isPregnant: els.pregnancy.checked,
                isBreastfeeding: els.breastfeeding.checked,
                isCycle: els.cycle.checked,
                goal: els.goal.value
            }));
        }

        els.isChild.addEventListener("change", syncSections);
        els.gender.addEventListener("change", syncSections);
        syncSections();
    </script>
</body>
</html>
