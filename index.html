<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aina Évidence — персональный конструктор меню</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231f4d3f'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='20' fill='%23f6f2ea' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/styles.css">
    <script>(function(){var t=localStorage.getItem('aina-theme')||'light';document.documentElement.dataset.theme=t;})();</script>
</head>
<body>
    <header class="topbar">
        <div class="brand"><span class="mark">A</span>Aina <em>Évidence</em></div>
        <div class="subtitle">Персональный конструктор меню</div>
        <button id="theme-toggle" class="theme-toggle" title="Сменить тему" aria-label="Сменить тему"></button>
    </header>
    <nav id="nav" class="tabs"></nav>
    <main id="app" class="container"></main>
    <footer class="foot">Aina Évidence · КБЖУ 30/30/40 · калорийность рассчитывается индивидуально</footer>
    <script type="module" src="js/app.js"></script>
    <script type="module">
        import { toggleTheme, updateBtn } from "./js/theme.js";
        const btn = document.getElementById("theme-toggle");
        btn.addEventListener("click", toggleTheme);
        updateBtn();
    </script>
</body>
</html>
